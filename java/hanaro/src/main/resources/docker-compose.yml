version: '3.8'

services:
  mysql-db:
    image: mysql:8
    container_name: hanaro-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: hanarodb
      MYSQL_USER: hanaro
      MYSQL_PASSWORD: 12345678
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
